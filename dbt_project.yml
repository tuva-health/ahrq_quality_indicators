name: 'ahrq_measures'
version: '0.1.0'
config-version: 2
require-dbt-version: ">=1.10.0"

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  tuva_last_run: '{{ run_started_at.astimezone(modules.pytz.timezone("UTC")) }}'

seeds:
  ahrq_measures:
    value_sets:
      ahrq_measures:
        pqi__measures:
          +post-hook: "{{ the_tuva_project.load_versioned_seed('value_sets','ahrq_measures__pqi_measures.csv') }}"
        pqi__value_sets:
          +post-hook: "{{ the_tuva_project.load_versioned_seed('value_sets','ahrq_measures__pqi.csv') }}"
