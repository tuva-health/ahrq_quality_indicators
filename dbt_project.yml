name: 'ahrq_quality_indicators'
version: '0.1.0'
config-version: 2
require-dbt-version: ">=1.10.0"

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  tuva_last_run: '{{ run_started_at.astimezone(modules.pytz.timezone("UTC")) }}'

seeds:
  ahrq_quality_indicators:
    value_sets:
      ahrq_quality_indicators:
        pqi__measures:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/ahrq-quality-indicators/' ~ var('ahrq_quality_indicators_seed_version', '1.0.0'), 'ahrq_measures__pqi_measures.csv', true, true, true) }}"
        pqi__value_sets:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/ahrq-quality-indicators/' ~ var('ahrq_quality_indicators_seed_version', '1.0.0'), 'ahrq_measures__pqi.csv', true, true, true) }}"
